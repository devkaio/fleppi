include: package:flutter_lints/flutter.yaml

# https://github.com/dart-lang/dart_style/issues/1652
formatter:
  trailing_commas: preserve
  page_width: 80

linter:
  rules:
    prefer_const_constructors: true
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
